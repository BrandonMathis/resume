# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/v2.8/schema.json
# Authoritative resume source. Render with `make pdf`; audit with `make check-layout`.
cv:
  name: Brandon Mathis
  location: Raleigh, NC -- USA
  email: bemathis@gmail.com
  social_networks:
    - network: LinkedIn
      username: mathisbrandon
    - network: GitHub
      username: brandonmathis
  sections:
    Summary:
      - >-
        Full-stack software engineer with 16+ years building web and mobile products for startups and enterprise businesses.
        Hands-on technical leader experienced in using AI tools and integrating AI into products.
        Has worked as both a manager and individual contributor on teams of all sizes, taking ownership of feature development across every layer of the stack.
    Recent Work Experience:
      - company: This Dot Labs
        location: Raleigh, NC (remote)
        position: Engineering Lead
        start_date: 2024-10
        end_date: present
        highlights:
          - Hands-on Engineering Lead for client projects including OpenAI, HUDL, Skylight Social, and Primerica
          - Led architecture and implementation for HUDL's FastDraw, FastScout, and FastRecruit migrations to React web and hybrid mobile apps; helped deliver all three by a hard six-month deadline for NBA, NCAA, and WNBA teams
          - Partnered with Skylight Social's founders to build and launch a Mark Cuban-backed short-form video app on AT Protocol, using React Native and Expo for iOS and Android; the app onboarded 55,000+ users in its first 24 hours
          - Helped build Skylight's Swift/Kotlin video editor via Expo Modules and ship daily OTA releases via Expo Updates
          - Host The Context Window podcast, interviewing engineers from OpenAI and Clerk on coding agents and LLMs; spoke at All Things Open and Chain React on web, mobile, and AI-enabled software development and SDLC best practices
      - company: vTestify
        location: Raleigh, NC
        position: Principal Engineer & Contract CTO
        start_date: 2019-08
        end_date: 2024-12
        highlights:
          - Architected and built a full-stack deposition for the US Legal industry, using React, Node.js, and Ruby on Rails
          - Drove 10x revenue growth by scaling WebRTC conferencing capacity and building enterprise white-label solutions
          - Built document management tools for uploads, PDF processing, and annotation; integrated Web Audio API with OpenAI Whisper for real-time multichannel transcription synced to video for timestamp-based navigation
          - Integrated OpenAI through LangChain and built vector-backed retrieval-augmented generation (RAG) workflows
          - Partnered with Sales and Product to translate customer needs into tailored features that helped win new business
          - Led creation of hiring and team management processes to support rapid growth during COVID-19 pandemic
      - company: Mathis LLC
        location: Raleigh, NC
        position: Freelance Full-Stack Engineer
        start_date: 2017-11
        end_date: 2019-12
        highlights:
          - Operated as an independent contract-for-hire software engineer specializing in building web and mobile products
          - Built custom software for companies such as McKesson, Dana-Farber, Duke Health, Moog Music, and MAC Cosmetics
          - Worked directly with stakeholders and business owners to turn business needs into full-stack web and mobile applications using JavaScript, React, React Native, PHP, Python, Ruby on Rails, Go, Docker, and REST APIs
          - Provided expert training services for company teams looking to upskill their engineers into development tools
      - company: Smashing Boxes
        location: Raleigh, NC
        position: Lead Software Engineer -- Director of Technology
        start_date: 2014-08
        end_date: 2017-11
        highlights:
          - Rose from Lead Engineer to Director of Technology, taking ownership of engineering quality, staffing, and delivery for a 30+ person organization spanning frontend, backend, and mobile engineering
          - Partnered with Sales on contracts, solution architecture, and estimates, guiding clients from pitch through delivery
          - Collaborated with design, customers, and stakeholders to build flagship React, Ruby on Rails, and iOS/Swift apps
          - Helped build Taperole, a company-wide DevOps deployment toolkit using Ruby and Ansible, adding PostgreSQL backups, Ruby on Rails update support, automatic CVE resolution, and TLS certificate-renewal fixes
      - company: Assetricity LLC
        location: Raleigh, NC
        position: Software Engineer
        start_date: 2009-07
        end_date: 2014-08
        highlights:
          - Built condition-based maintenance software in Java and Ruby on Rails deployed in IBM WebSphere via JRuby
          - Attended ISO 15926 standards committee meetings to report back to technical teams and support when needed
          - Built an Ember.js/JavaScript P&ID viewer for chemical and petroleum gas refinery layout specifications
          - Created XML schemas (XSD) to reinforce XML data structures dictated by ISO standards committees
          - Maintained internal Java Ruby, and Javascript applications and the company’s Drupal website
    Education:
      - institution: East Carolina University
        location: Greenville, NC
        degree: BS
        area: Computer Science with Business Minor
        start_date: 2006
        end_date: 2009
    Leadership & Community Activities:
      - company: Triangle Developers
        position: Founder -- Organizer
        date: Current
        highlights:
          - Founded community meetup containing over 3,000 software engineers across the NC Triangle area
          - Tech community organizer since 2012 hosting regular community events, networking hours, and tech talks in partnership with companies across the NC RTP area
          - All Things Open talk selection committee member since 2014
      - company: All Things Open
        position: Speaker selection committee member and technical content producer
        date: Current
        highlights:
          - Participate in All Things Open speaker selection process for engineering focused event tracks
          - Attended and spoke at several of All Things Open's conferences and meetups across the east coast
          - Fostered relationships between All Things Open and other local community meetups in Raleigh NC
      - company: Rails Bridge
        position: Founder
        start_date: 2015
        end_date: 2018
        highlights:
          - Founded Rails Bridge chapter alongside a team of engineers committed to increasing diversity in tech
          - Developed Rails Bridge curriculum where we took non-coders and immersed them in a day-long hackathon where they get to experience building a Ruby on Rails app from 0 to 100
          - Oversaw selection of volunteers that assist attendees with computer setup and problem solving
      - company: The Iron Yard
        position: Advisory Board Member & Guest Instructor
        start_date: 2015
        end_date: 2017
        highlights:
          - Provided input to Iron Yard curriculum writers on which technologies were most relevant for students to learn
          - Guest speaker to students on emerging topics such as Docker and React.js
          - Mentored select students to provide a hands-on perspective of what being a Software Engineer is like
      - company: Triangle Javascript
        position: Co-Organizer
        start_date: 2014
        end_date: 2019
        highlights:
          - Attended and led meetups across the NC RTP Area
          - Presented talks to members on Javascript concept mostly tied to React and React Native (circa 2016)
          - Oversaw general coordination with speakers, location, and attendees
      - company: Triangle Ruby
        position: Founder
        start_date: 2012
        end_date: 2019
        highlights:
          - Formed Triangle Ruby meetup because I wanted there to be a strong Ruby community in my local city
          - Acted as sole organizer for over 6 years doing speaker selection and coordination between locations and meetup sponsors
          - Hosted and spoke at several local corporate headquarters across the NC Triangle area for Ruby developers such as Metlife, IBM, Bandwidth, Webassign, Microsoft, and Duke University

design:
  theme: classic
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false
    show_top_note: false
  colors:
    body: black
    name: black
    # Optional per-variant headline (variants/<name>.yaml `headline:`); baseline has none.
    headline: black
    connections: black
    section_titles: black
    links: '#0000EE'
  typography:
    font_family: Helvetica
    font_size:
      body: 10pt
      name: 17.28pt
      connections: 9pt
      section_titles: 12pt
      headline: 12pt
    bold:
      headline: true
    # Fixed 10pt text frame in classic/Preamble.j2.typ + 2pt leading = 12pt baselines.
    line_spacing: 2pt
    alignment: left
  links:
    underline: false
    show_external_link_icon: false
  header:
    space_below_name: 8pt
    space_below_headline: 6pt
    space_below_connections: 9pt
    connections:
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: '•'
      space_between_connections: 5pt
  section_titles:
    type: centered_without_line
    space_above: 15pt
    space_below: 8pt
  sections:
    allow_page_break: true
    space_between_regular_entries: 10pt
    show_time_spans_in: []
  entries:
    date_and_location_width: 145pt
    side_space: 0pt
    space_between_columns: 6pt
    allow_page_break: false
    short_second_row: false
    highlights:
      bullet: '•'
      space_left: 5pt
      space_above: 3pt
      space_between_items: 1.5pt
      space_between_bullet_and_text: 5pt
  templates:
    experience_entry:
      main_column: |-
        **COMPANY**
        *POSITION*
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        *DATE*
    education_entry:
      main_column: |-
        **INSTITUTION**
        *DEGREE, AREA*
      degree_column: ''
      date_and_location_column: |-
        LOCATION
        *DATE*
locale:
  language: english
  present: Current
settings:
  pdf_title: Brandon Mathis Resume
  render_command:
    pdf_path: build/resume.pdf
    typst_path: build/resume.typ
    # PDF only; Typst is RenderCV's required intermediate for the PDF.
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
